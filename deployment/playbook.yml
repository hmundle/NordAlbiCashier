---
- name: OS Update for Ubuntu 26.04 Hosts
  hosts: nac_servers
  become: true # Escalates to sudo to run apt commands

  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: full
        autoremove: yes
        autoclean: yes

    - name: Ensure Podman and extra tools are installed
      ansible.builtin.apt:
        name:
          - podman
          - curl
          - tree
        state: present
        update_cache: yes

    # - name: Prune everything
    #   containers.podman.podman_prune:
    #     system: true

    - name: Prune podman's unused data (images) weekly
      ansible.builtin.cron:
        name: "podman system prune"
        special_time: weekly
        # delete unused images/containers, which are not new, and log to journal (searchable with `sudo journalctl -rt cron-podman-prune`)
        job: "/usr/bin/podman system prune --all --filter 'until=168h' --force 2>&1 | systemd-cat -t cron-podman-prune"

    # 1. Quadlet Infrastructure (Network and Volumes)
    - name: Create Quadlet network
      containers.podman.podman_network:
        name: nac
        state: quadlet

    - name: Create Quadlet volume for Postgres data
      containers.podman.podman_volume:
        name: nac_db_data
        state: quadlet

    # Resolve the primary's inventory hostname from db_role.
    # Requires that hosts can resolve each other's hostnames
    # (DNS or /etc/hosts).
    - name: Determine primary host name from inventory
      ansible.builtin.set_fact:
        primary_host: "{{ groups['nac_servers'] | map('extract', hostvars) | selectattr('db_role', 'equalto', 'primary') | map(attribute='inventory_hostname') | first }}"

    # 2. PostgreSQL Configuration Options
    # Primary setup: Enable replication settings and custom startup command
    - name: Set DB environment & options for Primary (Host 1)
      ansible.builtin.set_fact:
        pg_env:
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: "{{ db_name }}"
        pg_exec_cmd: >-
          postgres
          -c wal_level=replica
          -c max_wal_senders=10
          -c max_replication_slots=10
          -c hot_standby=on
      when: db_role == 'primary'

    # Standby setup: Connects to Primary via pg_basebackup on first boot
    - name: Set DB environment & options for Standby (Host 2)
      ansible.builtin.set_fact:
        pg_env:
          POSTGRES_PASSWORD: "{{ db_password }}"
        pg_exec_cmd: 'bash -c "if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then rm -rf /var/lib/postgresql/data/* && PGPASSWORD=\"{{ db_repl_password }}\" pg_basebackup -h {{ primary_host }} -p 5432 -U {{ db_repl_user }} -D /var/lib/postgresql/data -Fp -Xs -R; fi; exec gosu postgres postgres;"'
      when: db_role == 'standby'

    # 3. Define PostgreSQL Database Quadlet Container
    - name: Container for NAC Database
      containers.podman.podman_container:
        name: nac_db
        image: "docker.io/library/postgres:17-alpine"
        state: quadlet
        network:
          - nac.network
        volume:
          - "nac_db_data:/var/lib/postgresql/data/"
        ports:
          - "5432:5432"
        env: "{{ pg_env }}"
        command: "{{ pg_exec_cmd }}"
        healthcheck: "su -c 'pg_isready -U {{ db_user }}' postgres"
        healthcheck_interval: 10s
        healthcheck_timeout: 5s
        healthcheck_retries: 5
        healthcheck_start_period: 30s
        quadlet_options:
          - |
            [Unit]
            Description=NAC PostgreSQL Database ({{ db_role }})
            [Service]
            Restart=always
            [Install]
            WantedBy=default.target
      notify: Reload systemd and restart Quadlet services

    # Handlers only run at the end of the play by default, but the next task
    # needs `nac_db` to already be up and running (podman exec into it).
    # Flushing here forces the "Reload systemd and restart Quadlet services"
    # handler to run now instead of after the whole play finishes.
    - name: Flush handlers so nac_db is running before we exec into it
      ansible.builtin.meta: flush_handlers

    # 4. Create Replication User and Rules on Primary
    - name: Setup Replication User on Primary
      ansible.builtin.command: >
        podman exec nac_db psql -U {{ db_user }} -d {{ db_name }} -c
        "DO $$ BEGIN
           IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ db_repl_user }}') THEN
             CREATE ROLE {{ db_repl_user }} WITH REPLICATION LOGIN PASSWORD '{{ db_repl_password }}';
           END IF;
         END $$;"
      when: db_role == 'primary'
      changed_when: false

    # 5. Define Main Application Container (Runs on both hosts)
    - name: Container for NAC service
      containers.podman.podman_container:
        name: nac
        image: "docker.io/munhei/nac_service:{{ nac_image_tag | default('latest') }}"
        state: quadlet
        pull: always
        network:
          - nac.network
        healthcheck: "curl http://localhost:5000/Home/Index --fail" # --fail forces to restart, as soon as request return any error HTTP code
        healthcheck_failure_action: kill # systemd starts container again, if configured in [Service] to do so
        healthcheck_start_period: 30s
        read_only: true
        env:
          ASPNETCORE_ENVIRONMENT: "{{ aspnetcore_environment | default('Production') }}"
          ASPNETCORE_HTTP_PORTS: "5000"
          ConnectionStrings__DefaultConnection: "Host=nac_db;Port=5432;Database={{ db_name }};Username={{ db_user }};Password={{ db_password }}"
        ports:
          - "5000:5000"
        quadlet_options:
          - |
            [Unit]
            Description=NAC Web Application
            After=network-online.target nac_db.service
            Requires=nac_db.service
            [Service]
            Restart=always
            [Install]
            WantedBy=default.target
        # After= is required to successfully pull for the image
        # Restart= is required to start the container after crash, failing health check etc.
        # WantedBy=default.target is required to start automatically after boot

    # 5. Ensure generated Quadlet files are readable
    - name: Ensure all Quadlet files are readable
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - nac.container
        - nac_db.container
        - nac_db_data.volume
        - nac.network

    - name: Reload NAC services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
        enabled: true
      loop:
        - nac

  handlers:
    - name: Reload systemd and restart Quadlet services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
        enabled: true
      loop:
        - nac_db
